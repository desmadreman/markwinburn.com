<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordie - Word Puzzle Game</title>
    <style>
        :root {
            --color-correct: #538d4e;
            --color-present: #b59f3b;
            --color-absent: #787c7e;
            --color-bg: #ffffff;
            --color-surface: #f6f7f8;
            --color-tile-border: #d3d6da;
            --color-tile-bg: #ffffff;
            --color-text: #1a1a1b;
            --color-key-bg: #d3d6da;
            --theme-accent: #4a90e2;
            --color-muted: #6a6d6e;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-correct: #538d4e;
                --color-present: #b59f3b;
                --color-absent: #3a3a3c;
                --color-bg: #121213;
                --color-surface: #1e1e1f;
                --color-tile-border: #3a3a3c;
                --color-tile-bg: #121213;
                --color-text: #ffffff;
                --color-key-bg: #818384;
                --theme-accent: #4a90e2;
                --color-muted: #818384;
            }
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        header {
            border-bottom: 1px solid var(--color-tile-border);
            width: 100%;
            text-align: center;
            padding: 14px 0;
            background-color: var(--color-bg);
            z-index: 5;
            position: relative;
        }

        .header-left-controls {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
        }

        .home-link {
            color: var(--color-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.15s ease;
        }

        .home-link:hover {
            color: var(--color-text);
            text-decoration: underline;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 4px;
            font-weight: 800;
            display: inline-block;
        }

        .header-right-controls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .new-puzzle-trigger, .solver-trigger {
            background: none;
            border: none;
            color: var(--color-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.15s ease;
            font-family: inherit;
            padding: 0;
        }

        .new-puzzle-trigger:hover, .solver-trigger:hover {
            text-decoration: underline;
            color: var(--color-text);
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            max-width: 500px;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        #grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 6px;
            width: 330px;
            height: 400px;
            max-width: 100%;
            margin-bottom: 24px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 6px;
        }

        .tile {
            border: 2px solid var(--color-tile-border);
            background-color: var(--color-tile-bg);
            color: var(--color-text);
            border-radius: 4px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            box-sizing: border-box;
        }

        .tile.correct { background-color: var(--color-correct); border-color: var(--color-correct); color: #ffffff; }
        .tile.present { background-color: var(--color-present); border-color: var(--color-present); color: #ffffff; }
        .tile.absent { background-color: var(--color-absent); border-color: var(--color-absent); color: #ffffff; }

        #keyboard {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            padding: 0 4px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
            touch-action: manipulation;
        }

        .key {
            background-color: var(--color-key-bg);
            color: var(--color-text);
            border: 0;
            border-radius: 4px;
            margin: 0 3px;
            height: 58px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .key.large { flex: 1.5; font-size: 0.85rem; }
        .key.correct { background-color: var(--color-correct); color: #ffffff; }
        .key.present { background-color: var(--color-present); color: #ffffff; }
        .key.absent { background-color: var(--color-absent); color: #ffffff; }

        #modal, #solver-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        #solver-modal { z-index: 15; }

        .modal-content, .solver-modal-content {
            background-color: var(--color-surface);
            border: 1px solid var(--color-tile-border);
            padding: 24px;
            border-radius: 12px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .solver-modal-content {
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .solver-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--color-tile-border);
            padding-bottom: 10px;
        }

        .solver-header h2 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
        }

        .solver-close-btn {
            background: none;
            border: none;
            color: var(--color-muted);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .solver-section-card {
            background-color: var(--color-bg);
            border: 1px solid var(--color-tile-border);
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
        }

        .solver-section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--color-muted);
        }

        .solver-row-inputs {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 6px;
        }

        .solver-tile-input {
            background-color: var(--color-surface);
            border: 2px solid var(--color-tile-border);
            color: var(--color-text);
            border-radius: 4px;
            height: 42px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            outline: none;
        }

        .solver-text-box-input {
            width: 100%;
            background-color: var(--color-surface);
            border: 2px solid var(--color-tile-border);
            color: var(--color-text);
            border-radius: 4px;
            padding: 10px;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-sizing: border-box;
            outline: none;
        }

        .solver-results-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 12px;
        }

        @media (max-width: 480px) {
            .solver-results-container { grid-template-columns: 1fr; }
        }

        .solver-results-box {
            background-color: var(--color-bg);
            border: 1px solid var(--color-tile-border);
            border-radius: 8px;
            padding: 12px;
        }

        .solver-results-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .solver-results-item {
            background-color: var(--color-surface);
            border: 1px solid var(--color-tile-border);
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .solver-btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 12px;
        }

        .solver-btn {
            color: white;
            border: none;
            padding: 10px 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .solver-btn-sync { background-color: var(--theme-accent); }
        .solver-btn-clear { background-color: #c62828; }

        .btn {
            background-color: var(--theme-accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--color-tile-border);
            color: var(--color-text);
        }

        #toast {
            visibility: hidden;
            min-width: 160px;
            background-color: var(--color-text);
            color: var(--color-bg);
            text-align: center;
            border-radius: 4px;
            padding: 12px 20px;
            position: fixed;
            z-index: 20;
            top: 10%;
            font-weight: bold;
        }

        #toast.show {
            visibility: visible;
            animation: fadeInOut 2s ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateY(-10px); }
            15%, 85% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left-controls">
            <a href="index.html" class="home-link">← Home</a>
        </div>
        <h1>WORDIE</h1>
        <div class="header-right-controls">
            <button class="new-puzzle-trigger" onclick="resetGame()">new puzzle</button>
            <button class="solver-trigger" onclick="openSolver()">solver</button>
        </div>
    </header>

    <div id="game-container">
        <div id="grid"></div>
        <div id="keyboard">
            <div class="keyboard-row" id="row-1"></div>
            <div class="keyboard-row" id="row-2"></div>
            <div class="keyboard-row" id="row-3"></div>
        </div>
    </div>

    <div id="toast">Loading dictionaries...</div>

    <div id="modal">
        <div class="modal-content" style="text-align:center;">
            <h2 id="modal-title">Status</h2>
            <div id="modal-word-container" style="display:none; margin: 15px 0;">
                The word was: <div style="font-size: 1.4rem; font-weight: 800; color: var(--theme-accent);" id="modal-word"></div>
            </div>
            <p id="modal-message"></p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                <button class="btn" onclick="resetGame()">Play Again</button>
            </div>
        </div>
    </div>

    <div id="solver-modal">
        <div class="solver-modal-content">
            <div class="solver-header">
                <h2>WORDIE ASSISTANT</h2>
                <button class="solver-close-btn" onclick="closeSolver()">&times;</button>
            </div>

            <div id="solver-summary" style="text-align:center; font-size: 0.8rem; color: var(--color-muted);">Ready</div>

            <div class="solver-section-card">
                <div class="solver-section-title">Correct Spot (Green)</div>
                <div class="solver-row-inputs">
                    <input type="text" maxlength="1" class="solver-tile-input solver-correct-input">
                    <input type="text" maxlength="1" class="solver-tile-input solver-correct-input">
                    <input type="text" maxlength="1" class="solver-tile-input solver-correct-input">
                    <input type="text" maxlength="1" class="solver-tile-input solver-correct-input">
                    <input type="text" maxlength="1" class="solver-tile-input solver-correct-input">
                </div>
            </div>

            <div class="solver-section-card">
                <div class="solver-section-title">Present, Wrong Spot (Yellow)</div>
                <div class="solver-row-inputs">
                    <input type="text" class="solver-tile-input solver-exclude-input" placeholder="ø">
                    <input type="text" class="solver-tile-input solver-exclude-input" placeholder="ø">
                    <input type="text" class="solver-tile-input solver-exclude-input" placeholder="ø">
                    <input type="text" class="solver-tile-input solver-exclude-input" placeholder="ø">
                    <input type="text" class="solver-tile-input solver-exclude-input" placeholder="ø">
                </div>
            </div>

            <div class="solver-section-card">
                <div class="solver-section-title">Excluded Letters (Gray)</div>
                <input type="text" id="solver-absent-letters" class="solver-text-box-input" placeholder="e.g. AEIO">
            </div>

            <div class="solver-results-container">
                <div class="solver-results-box">
                    <div class="solver-section-title" style="color: var(--color-correct);">Most Probable Solutions</div>
                    <ul id="solver-possible-answers" class="solver-results-list"></ul>
                </div>
                <div class="solver-results-box">
                    <div class="solver-section-title" style="color: var(--theme-accent);">Best Next Eliminator Words</div>
                    <ul id="solver-best-eliminators" class="solver-results-list"></ul>
                </div>
            </div>

            <div class="solver-btn-row">
                <button class="solver-btn solver-btn-sync" onclick="syncSolverFromBoard()">Sync Board</button>
                <button class="solver-btn solver-btn-clear" onclick="clearSolverFields()">Clear</button>
            </div>
        </div>
    </div>

    <script>
        let ANSWERS = [];
        let GUESSES = [];
        let ALL_VALID_WORDS = [];
        let targetWord = "";
        let currentRow = 0;
        let currentTile = 0;
        let gameOver = false;
        let guesses = Array(6).fill("");

        const grid = document.getElementById("grid");
        const toast = document.getElementById("toast");

        async function loadDictionaries() {
            try {
                const [answersRes, guessesRes] = await Promise.all([
                    fetch('./answers.json'),
                    fetch('./guesses.json')
                ]);

                if (!answersRes.ok || !guessesRes.ok) throw new Error("Could not load dictionary files");

                ANSWERS = await answersRes.json();
                GUESSES = await guessesRes.json();

                ANSWERS = ANSWERS.map(w => w.trim().toUpperCase());
                GUESSES = GUESSES.map(w => w.trim().toUpperCase());

                ALL_VALID_WORDS = Array.from(new Set([...ANSWERS, ...GUESSES]));

                resetGame();
            } catch (err) {
                showToast("Error loading dictionary files");
                console.error("Failed loading dictionary JSON files:", err);
            }
        }

        function initGrid() {
            grid.innerHTML = "";
            for (let i = 0; i < 6; i++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                grid.appendChild(row);
            }
        }

        function initKeyboard() {
            const rows = [
                ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p"],
                ["a", "s", "d", "f", "g", "h", "j", "k", "l"],
                ["enter", "z", "x", "c", "v", "b", "n", "m", "backspace"]
            ];

            rows.forEach((row, i) => {
                const rowElem = document.getElementById(`row-${i + 1}`);
                rowElem.innerHTML = "";
                row.forEach(key => {
                    const btn = document.createElement("button");
                    btn.className = "key";
                    btn.textContent = key === "backspace" ? "⌫" : key;
                    btn.id = `key-${key}`;
                    if (key === "enter" || key === "backspace") btn.classList.add("large");
                    btn.addEventListener("click", () => handleInput(key));
                    rowElem.appendChild(btn);
                });
            });
        }

        function handleInput(key) {
            if (gameOver || ALL_VALID_WORDS.length === 0) return;
            const cleanKey = key.toLowerCase();

            if (cleanKey === "enter") submitGuess();
            else if (cleanKey === "backspace" || cleanKey === "back") deleteLetter();
            else if (/^[a-z]$/.test(cleanKey)) addLetter(cleanKey.toUpperCase());
        }

        function addLetter(letter) {
            if (currentTile < 5) {
                document.getElementById(`tile-${currentRow}-${currentTile}`).textContent = letter;
                guesses[currentRow] += letter;
                currentTile++;
            }
        }

        function deleteLetter() {
            if (currentTile > 0) {
                currentTile--;
                document.getElementById(`tile-${currentRow}-${currentTile}`).textContent = "";
                guesses[currentRow] = guesses[currentRow].slice(0, -1);
            }
        }

        function submitGuess() {
            const guess = guesses[currentRow];
            if (guess.length !== 5) { showToast("Not enough letters"); return; }
            if (!ALL_VALID_WORDS.includes(guess)) { showToast("Not in word list"); return; }
            evaluateGuess(guess);
        }

        function evaluateGuess(guess) {
            const targetArr = targetWord.split("");
            const guessArr = guess.split("");
            const status = Array(5).fill("absent");

            guessArr.forEach((char, i) => {
                if (char === targetArr[i]) { status[i] = "correct"; targetArr[i] = null; }
            });

            guessArr.forEach((char, i) => {
                if (status[i] !== "correct" && targetArr.includes(char)) {
                    status[i] = "present";
                    targetArr[targetArr.indexOf(char)] = null;
                }
            });

            guessArr.forEach((char, i) => {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                const key = document.getElementById(`key-${char.toLowerCase()}`);
                tile.classList.add(status[i]);
                if (key) {
                    if (status[i] === "correct") key.className = "key correct";
                    else if (status[i] === "present" && !key.classList.contains("correct")) key.className = "key present";
                    else if (!key.classList.contains("correct") && !key.classList.contains("present")) key.className = "key absent";
                }
            });

            if (guess === targetWord) { gameOver = true; showModal("Splendid!", false); }
            else if (currentRow === 5) { gameOver = true; showModal("Game Over", true); }
            else { currentRow++; currentTile = 0; }
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2000);
        }

        function showModal(title, revealWord) {
            document.getElementById("modal-title").textContent = title;
            const container = document.getElementById("modal-word-container");
            if (revealWord) {
                container.style.display = "block";
                document.getElementById("modal-word").textContent = targetWord;
            } else container.style.display = "none";
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() { document.getElementById("modal").style.display = "none"; }

        function resetGame() {
            if (ANSWERS.length === 0) return;
            targetWord = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
            currentRow = 0; currentTile = 0; gameOver = false;
            guesses = Array(6).fill("");
            closeModal(); initGrid(); initKeyboard();
        }

        function openSolver() {
            syncSolverFromBoard();
            document.getElementById("solver-modal").style.display = "flex";
        }

        function closeSolver() { document.getElementById("solver-modal").style.display = "none"; }

        function clearSolverFields() {
            document.querySelectorAll(".solver-tile-input").forEach(i => i.value = "");
            document.getElementById("solver-absent-letters").value = "";
            runSolverFilter();
        }

        function syncSolverFromBoard() {
            clearSolverFields();
            let correct = Array(5).fill("");
            let excludes = Array(5).fill("");
            let absent = new Set();

            for (let r = 0; r < currentRow; r++) {
                const guess = guesses[r];
                for (let c = 0; c < 5; c++) {
                    const tile = document.getElementById(`tile-${r}-${c}`);
                    const char = guess[c];
                    if (tile.classList.contains("correct")) correct[c] = char;
                    else if (tile.classList.contains("present")) excludes[c] += char;
                    else if (tile.classList.contains("absent")) absent.add(char);
                }
            }

            document.querySelectorAll(".solver-correct-input").forEach((inp, idx) => inp.value = correct[idx]);
            document.querySelectorAll(".solver-exclude-input").forEach((inp, idx) => inp.value = excludes[idx]);
            document.getElementById("solver-absent-letters").value = Array.from(absent).join("");
            runSolverFilter();
        }

        function runSolverFilter() {
            const correctInputs = Array.from(document.querySelectorAll(".solver-correct-input")).map(i => i.value.toUpperCase());
            const excludeInputs = Array.from(document.querySelectorAll(".solver-exclude-input")).map(i => i.value.toUpperCase());
            const absentLetters = document.getElementById("solver-absent-letters").value.toUpperCase().split("");
            const allYellows = excludeInputs.join("").split("");

            const solutions = ANSWERS.filter(w => {
                for (let i = 0; i < 5; i++) {
                    if (correctInputs[i] && w[i] !== correctInputs[i]) return false;
                }
                for (let i = 0; i < 5; i++) {
                    if (excludeInputs[i] && excludeInputs[i].includes(w[i])) return false;
                }
                for (let y of allYellows) {
                    if (!w.includes(y)) return false;
                }
                for (let a of absentLetters) {
                    if (w.includes(a) && !correctInputs.includes(a) && !allYellows.includes(a)) return false;
                }
                return true;
            });

            document.getElementById("solver-summary").textContent = `${solutions.length} Possible Solutions Remaining`;

            const solutionsList = document.getElementById("solver-possible-answers");
            solutionsList.innerHTML = "";
            solutions.slice(0, 10).forEach(w => {
                const li = document.createElement("li");
                li.className = "solver-results-item";
                li.textContent = w;
                solutionsList.appendChild(li);
            });

            if (solutions.length === 0) {
                solutionsList.innerHTML = `<li class="solver-results-item" style="color: var(--color-muted);">No solutions match</li>`;
            }

            const eliminatorsList = document.getElementById("solver-best-eliminators");
            eliminatorsList.innerHTML = "";

            if (solutions.length <= 2) {
                eliminatorsList.innerHTML = `<li class="solver-results-item" style="color: var(--color-muted);">Guess directly!</li>`;
            } else {
                let letterFreq = {};
                solutions.forEach(w => {
                    new Set(w.split("")).forEach(char => {
                        letterFreq[char] = (letterFreq[char] || 0) + 1;
                    });
                });

                let scoredWords = ALL_VALID_WORDS.map(w => {
                    let uniqueChars = new Set(w.split(""));
                    let score = 0;
                    uniqueChars.forEach(char => {
                        if (letterFreq[char]) score += letterFreq[char];
                    });
                    return { word: w, score: score };
                });

                scoredWords.sort((a, b) => b.score - a.score);

                scoredWords.slice(0, 5).forEach(item => {
                    const li = document.createElement("li");
                    li.className = "solver-results-item";
                    li.innerHTML = `<span>${item.word}</span> <span style="font-size:0.75rem; color:var(--color-muted);">${item.score} pts</span>`;
                    eliminatorsList.appendChild(li);
                });
            }
        }

        document.querySelectorAll(".solver-tile-input, #solver-absent-letters").forEach(elem => {
            elem.addEventListener("input", runSolverFilter);
        });

        document.addEventListener("keydown", (e) => {
            if (document.getElementById("solver-modal").style.display === "flex") return;
            if (e.key === "Enter") handleInput("enter");
            else if (e.key === "Backspace") handleInput("backspace");
            else if (/^[a-zA-Z]$/.test(e.key)) handleInput(e.key);
        });

        loadDictionaries();
    </script>
</body>
</html>
