<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Places I've Been Since May 2025</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --ink:#1b2a3a;
    --parchment:#f2ead9;
    --parchment-deep:#e7dcc4;
    --brass:#b8863b;
    --stamp-red:#9c3d3d;
    --pine:#3f5d4e;
    --white:#fffdf8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Inter',sans-serif;color:var(--ink);}
  #map{position:absolute;inset:0;z-index:0;}

  .leaflet-container{background:#e9e4d6;font-family:'Inter',sans-serif;}

  /* ---- top panel ---- */
  .panel{
    position:absolute;
    top:16px;left:16px;
    z-index:1000;
    background:rgba(242,234,217,0.96);
    border:1px solid var(--parchment-deep);
    border-radius:10px;
    padding:18px 20px;
    max-width:300px;
    box-shadow:0 8px 24px rgba(27,42,58,0.18);
  }
  .panel h1{
    font-family:'Fraunces',serif;
    font-size:1.5rem;
    font-weight:700;
    margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  .panel .sub{
    font-size:0.78rem;
    color:#6b6152;
    margin-bottom:14px;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .legend{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .legend label{
    display:flex;align-items:center;gap:8px;
    font-size:0.88rem;cursor:pointer;user-select:none;
  }
  .legend input{accent-color:var(--brass);width:15px;height:15px;}
  .legend .em{font-size:1.05rem;}

  .stamp{
    position:absolute;
    top:-14px;right:-14px;
    width:78px;height:78px;
    border-radius:50%;
    border:2px dashed var(--stamp-red);
    color:var(--stamp-red);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-10deg);
    font-family:'JetBrains Mono',monospace;
    text-align:center;
    line-height:1.05;
    background:rgba(255,253,248,0.5);
    pointer-events:none;
  }
  .stamp .n{font-size:1.35rem;font-weight:700;}
  .stamp .t{font-size:0.5rem;letter-spacing:0.05em;text-transform:uppercase;}

  /* ---- add button ---- */
  .add-btn{
    position:absolute;bottom:24px;right:24px;z-index:1000;
    background:var(--ink);color:var(--white);
    border:none;border-radius:999px;
    padding:12px 20px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:0.9rem;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(27,42,58,0.35);
    display:flex;align-items:center;gap:8px;
  }
  .add-btn:hover{background:#28405a;}

  /* ---- modal ---- */
  .overlay{
    position:fixed;inset:0;z-index:2000;
    background:rgba(27,42,58,0.55);
    display:none;align-items:center;justify-content:center;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--white);
    border-radius:12px;
    padding:28px;
    width:100%;max-width:400px;
    max-height:86vh;overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .modal h2{
    font-family:'Fraunces',serif;font-size:1.3rem;margin:0 0 4px;
  }
  .modal .hint{font-size:0.8rem;color:#7a7060;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.78rem;font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em;color:#4a4436;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 11px;border:1px solid #d9d0bc;border-radius:7px;
    font-family:'Inter',sans-serif;font-size:0.92rem;background:#fbf9f3;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .btn{
    width:100%;padding:11px;border:none;border-radius:8px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:0.92rem;cursor:pointer;
  }
  .btn-primary{background:var(--ink);color:var(--white);}
  .btn-primary:hover{background:#28405a;}
  .btn-ghost{background:none;color:#7a7060;margin-top:8px;font-weight:500;}
  .btn-ghost:hover{text-decoration:underline;}
  .btn-secondary{background:var(--parchment-deep);color:var(--ink);margin-top:8px;}
  .geo-result{
    font-size:0.82rem;background:#f1f6f3;border:1px solid #cfe0d8;
    border-radius:7px;padding:9px 11px;margin-bottom:12px;color:var(--pine);
  }
  .msg{font-size:0.82rem;margin-top:10px;text-align:center;}
  .msg.err{color:var(--stamp-red);}
  .msg.ok{color:var(--pine);}
  .divider{border:none;border-top:1px solid #e7e0d0;margin:18px 0;}
  .admin-list{max-height:150px;overflow-y:auto;font-size:0.82rem;}
  .admin-list .pin-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee6d4;}
  .admin-list .pin-row button{background:none;border:none;color:var(--stamp-red);cursor:pointer;font-size:0.78rem;}

  /* leaflet popup tweak */
  .leaflet-popup-content{font-family:'Inter',sans-serif;}
  .leaflet-popup-content b{font-family:'Fraunces',serif;font-size:1rem;}
  .pin-emoji{font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.35));}

  @media (max-width:520px){
    .panel{max-width:calc(100vw - 32px);}
  }

  /* ---- clock widget ---- */
  .clock-panel{
    position:absolute;
    top:16px;right:16px;
    z-index:1000;
    background:rgba(242,234,217,0.96);
    border:1px solid var(--parchment-deep);
    border-radius:10px;
    padding:12px 18px;
    text-align:center;
    box-shadow:0 8px 24px rgba(27,42,58,0.18);
  }
  .clock-panel .time{
    font-family:'JetBrains Mono',monospace;
    font-size:1.3rem;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--ink);
    white-space:nowrap;
  }
  .clock-panel .zone{
    font-size:0.68rem;
    color:#7a7060;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-top:2px;
  }

  /* ---- timezone dials ---- */
  .tz-dial-wrap{display:flex;flex-direction:column;align-items:center;}
  .tz-dial-label{
    font-family:'JetBrains Mono',monospace;
    font-size:0.6rem;
    color:var(--ink);
    background:rgba(242,234,217,0.9);
    padding:1px 4px;
    border-radius:3px;
    white-space:nowrap;
    margin-top:2px;
    pointer-events:none;
  }
</style>

<div id="map"></div>

<div class="panel">
  <div class="stamp"><span class="n" id="stampCount">0</span><span class="t">Stops</span></div>
  <h1>Where I've Been Since May 2025<br />And Places I've Ever Lived</h1>
  <div class="sub">A running map,<br />not a finished one</div>
  <div class="legend">
    <label><input type="checkbox" id="toggleVisited" checked><span class="em">📍</span> Visited</label>
    <label><input type="checkbox" id="toggleLived" checked><span class="em">🏠</span> Lived</label>
    <label><input type="checkbox" id="toggleTerminator" checked><span class="em">🌗</span> Day / Night</label>
    <label><input type="checkbox" id="toggleTZ"><span class="em">🕐</span> Time zones</label>
  </div>
</div>

<div class="clock-panel">
  <div class="time" id="clockTime">--:--:--</div>
  <div class="zone" id="clockZone">Loading…</div>
</div>

<button class="add-btn" id="openAdmin">+ Add a place</button>

<!-- Admin / Add Place Modal -->
<div class="overlay" id="overlay">
  <div class="modal">

    <!-- Step 1: password -->
    <div id="lockStep">
      <h2>Admin access</h2>
      <div class="hint">Enter the password to add or manage places.</div>
      <div class="field">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="unlockBtn">Unlock</button>
      <button class="btn btn-ghost" id="cancelLock">Cancel</button>
      <div class="msg err" id="lockMsg"></div>
    </div>

    <!-- Step 2: add place form -->
    <div id="formStep" style="display:none;">
      <h2>Add a place</h2>
      <div class="hint">Search for a spot, confirm the pin, then save.</div>

      <div class="field">
        <label for="placeName">Place name</label>
        <input type="text" id="placeName" placeholder="e.g. Kyoto, Japan">
      </div>
      <button class="btn btn-secondary" id="geocodeBtn" type="button">Find on map</button>
      <div id="geoResult"></div>

      <div class="row2">
        <div class="field">
          <label for="latInput">Latitude</label>
          <input type="text" id="latInput" placeholder="35.0116">
        </div>
        <div class="field">
          <label for="lngInput">Longitude</label>
          <input type="text" id="lngInput" placeholder="135.7681">
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="typeInput">Type</label>
          <select id="typeInput">
            <option value="visited">📍 Visited</option>
            <option value="lived">🏠 Lived</option>
          </select>
        </div>
        <div class="field">
          <label for="dateInput">Dates (optional)</label>
          <input type="text" id="dateInput" placeholder="2022">
        </div>
      </div>

      <div class="field">
        <label for="notesInput">Notes (optional)</label>
        <textarea id="notesInput" rows="2" placeholder="Anything worth remembering"></textarea>
      </div>

      <button class="btn btn-primary" id="savePinBtn" type="button">Save pin</button>
      <div class="msg ok" id="saveMsg"></div>

      <hr class="divider">
      <div class="hint" style="margin-bottom:8px;">Pins you've added on this device</div>
      <div class="admin-list" id="adminList"></div>

      <hr class="divider">
      <button class="btn btn-secondary" id="exportBtn" type="button">Export full HTML file</button>
      <button class="btn btn-ghost" id="closeAdmin" type="button">Close</button>
    </div>

  </div>
</div>

const map = L.map('map', {zoomControl:false}).setView([35, -75], 3);
L.control.zoom({position:'bottomleft'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);

function emojiIcon(emoji){
  return L.divIcon({
    className:'',
    html:`<div class="pin-emoji">${emoji}</div>`,
    iconSize:[26,26],
    iconAnchor:[13,24],
    popupAnchor:[0,-22]
  });
}
const visitedIcon = emojiIcon('📍');
const livedIcon = emojiIcon('🏠');

let visitedLayer = L.layerGroup();
let livedLayer = L.layerGroup();

function popupHtml(p, kind){
  let html = `<b>${p.name}</b>`;
  if(p.dates) html += `<br><span style="color:#7a7060;font-size:0.82rem;">${p.dates}</span>`;
  if(p.notes) html += `<br>${p.notes}`;
  return html;
}

function getCustomPins(){
  try{
    return JSON.parse(localStorage.getItem('travelMapCustomPins') || '[]');
  }catch(e){ return []; }
}
function saveCustomPins(pins){
  localStorage.setItem('travelMapCustomPins', JSON.stringify(pins));
}

function renderAll(){
  visitedLayer.clearLayers();
  livedLayer.clearLayers();

  VISITED.forEach(p => {
    L.marker([p.lat,p.lng], {icon:visitedIcon}).bindPopup(popupHtml(p)).addTo(visitedLayer);
  });
  LIVED.forEach(p => {
    L.marker([p.lat,p.lng], {icon:livedIcon}).bindPopup(popupHtml(p)).addTo(livedLayer);
  });

  const custom = getCustomPins();
  custom.forEach(p => {
    const icon = p.type === 'lived' ? livedIcon : visitedIcon;
    const layer = p.type === 'lived' ? livedLayer : visitedLayer;
    L.marker([p.lat,p.lng], {icon}).bindPopup(popupHtml(p)).addTo(layer);
  });

  visitedLayer.addTo(map);
  livedLayer.addTo(map);

  const total = VISITED.length + LIVED.length + custom.length;
  document.getElementById('stampCount').textContent = total;

  renderAdminList(custom);
}

document.getElementById('toggleVisited').addEventListener('change', e=>{
  if(e.target.checked) visitedLayer.addTo(map); else map.removeLayer(visitedLayer);
});
document.getElementById('toggleLived').addEventListener('change', e=>{
  if(e.target.checked) livedLayer.addTo(map); else map.removeLayer(livedLayer);
});

  const now = new Date();
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const dateStr = now.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
  document.getElementById('clockTime').textContent = timeStr;
  document.getElementById('clockZone').textContent = `${dateStr} · ${tz}`;
}
updateClock();
setInterval(updateClock, 1000);

/* =========================================================
   DAY / NIGHT TERMINATOR
   ========================================================= */
function subsolarPoint(date){
  const rad = Math.PI/180;
  const start = Date.UTC(date.getUTCFullYear(),0,1);
  const dayOfYear = Math.floor((date.getTime()-start)/86400000) + 1;
  const B = (360/365)*(dayOfYear-81)*rad;

  const decl = 23.44*Math.sin(B);
  const eot = 9.87*Math.sin(2*B) - 7.53*Math.cos(B) - 1.5*Math.sin(B);

  const utcHours = date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600;
  const lng = (12 - (utcHours + eot/60)) * 15;
  const lngNorm = ((lng + 540) % 360) - 180;

  return {lat:decl, lng:lngNorm};
}

function terminatorLatLngs(sub){
  const rad = Math.PI/180, deg = 180/Math.PI;
  const subLatR = sub.lat*rad;
  const pts = [];
  for(let lng=-180; lng<=180; lng+=2){
    const dLng = (lng - sub.lng)*rad;
    const lat = Math.atan2(-Math.cos(dLng), Math.tan(subLatR)) * deg;
    pts.push([lat, lng]);
  }
  return pts;
}

let terminatorLine = null;
let nightPolygon = null;

function drawTerminator(){
  const sub = subsolarPoint(new Date());
  const curve = terminatorLatLngs(sub);

  if(terminatorLine) map.removeLayer(terminatorLine);
  if(nightPolygon) map.removeLayer(nightPolygon);

  terminatorLine = L.polyline(curve, {
    color:'#b8863b', weight:2.2, opacity:0.9, dashArray:'1,5'
  });

  const nightPole = sub.lat >= 0 ? -90 : 90;
  const polyPts = curve.slice();
  polyPts.push([nightPole, 180]);
  polyPts.push([nightPole, -180]);

  nightPolygon = L.polygon(polyPts, {
    stroke:false, fillColor:'#0d1b2a', fillOpacity:0.24
  });

  if(document.getElementById('toggleTerminator').checked){
    nightPolygon.addTo(map);
    terminatorLine.addTo(map);
  }
}

drawTerminator();
setInterval(drawTerminator, 60000);

document.getElementById('toggleTerminator').addEventListener('change', e=>{
  if(e.target.checked){
    nightPolygon.addTo(map);
    terminatorLine.addTo(map);
  } else {
    map.removeLayer(nightPolygon);
    map.removeLayer(terminatorLine);
  }
});

/* =========================================================
   TIME ZONES
   ========================================================= */
let tzLayer = L.layerGroup();
let dialLayer = L.layerGroup();
let tzLoaded = false;
const dialMarkers = [];

function formatOffset(off){
  const sign = off < 0 ? '−' : '+';
  const abs = Math.abs(off);
  const h = Math.floor(abs);
  const m = Math.round((abs - h) * 60);
  return `UTC${sign}${h}${m ? ':' + String(m).padStart(2,'0') : ''}`;
}

function dialIcon(offset){
  const now = new Date();
  const shifted = new Date(now.getTime() + offset*3600000);
  const hrs = shifted.getUTCHours() % 12;
  const mins = shifted.getUTCMinutes();
  const hourDeg = (hrs + mins/60) * 30;
  const minDeg = mins * 6;

  const hand = (deg, len) => {
    const r = deg * Math.PI/180;
    return [17 + len*Math.sin(r), 17 - len*Math.cos(r)];
  };
  const [hx,hy] = hand(hourDeg, 8);
  const [mx,my] = hand(minDeg, 12.5);

  const ticks = [0,90,180,270].map(d=>{
    const r = d*Math.PI/180;
    const x1 = 17 + 12*Math.sin(r), y1 = 17 - 12*Math.cos(r);
    const x2 = 17 + 14.5*Math.sin(r), y2 = 17 - 14.5*Math.cos(r);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#b8863b" stroke-width="1.5" stroke-linecap="round"/>`;
  }).join('');

  const html = `
    <div class="tz-dial-wrap">
      <svg width="34" height="34" viewBox="0 0 34 34">
        <circle cx="17" cy="17" r="15.5" fill="#fffdf8" stroke="#1b2a3a" stroke-width="1.6"/>
        ${ticks}
        <line x1="17" y1="17" x2="${hx}" y2="${hy}" stroke="#1b2a3a" stroke-width="2.1" stroke-linecap="round"/>
        <line x1="17" y1="17" x2="${mx}" y2="${my}" stroke="#9c3d3d" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="17" cy="17" r="1.5" fill="#1b2a3a"/>
      </svg>
      <div class="tz-dial-label">${formatOffset(offset)}</div>
    </div>`;

  return L.divIcon({className:'', html, iconSize:[46,50], iconAnchor:[23,25]});
}

function updateDials(){
  dialMarkers.forEach(d => d.marker.setIcon(dialIcon(d.offset)));
}

function tzFillColor(offset){
  return (Math.round(offset*4) % 2 === 0) ? '#b8863b' : '#3f5d4e';
}

async function loadTimeZones(){
  if(tzLoaded) return;
  try{
    const res = await fetch('https://cdn.jsdelivr.net/gh/treyerl/timezones@master/timezones_wVVG8.geojson');
    const geo = await res.json();

    const offsets = new Set();

    L.geoJSON(geo, {
      style: f => {
        const off = parseFloat(f.properties.name);
        if(Number.isFinite(off)) offsets.add(off);
        return {
          color:'#1b2a3a', weight:1.1, opacity:0.55,
          fillColor: Number.isFinite(off) ? tzFillColor(off) : '#7a7060',
          fillOpacity:0.07
        };
      }
    }).addTo(tzLayer);

    offsets.forEach(off => {
      const lngRaw = off*15;
      const lng = ((lngRaw + 540) % 360) - 180;
      const marker = L.marker([80, lng], {icon:dialIcon(off), interactive:false});
      dialMarkers.push({marker, offset:off});
      marker.addTo(dialLayer);
    });

    tzLoaded = true;
  }catch(e){
    console.error('Time zone layer failed to load', e);
  }
}

setInterval(updateDials, 30000);

document.getElementById('toggleTZ').addEventListener('change', async e=>{
  if(e.target.checked){
    await loadTimeZones();
    tzLayer.addTo(map);
    dialLayer.addTo(map);
  } else {
    map.removeLayer(tzLayer);
    map.removeLayer(dialLayer);
  }
});

/* ---------- Admin modal logic ---------- */
const overlay = document.getElementById('overlay');
const lockStep = document.getElementById('lockStep');
const formStep = document.getElementById('formStep');
let unlocked = false;

document.getElementById('openAdmin').addEventListener('click', ()=>{
  overlay.classList.add('show');
  if(unlocked){
    lockStep.style.display='none';
    formStep.style.display='block';
  } else {
    lockStep.style.display='block';
    formStep.style.display='none';
    document.getElementById('pwInput').value='';
    document.getElementById('lockMsg').textContent='';
  }
});
document.getElementById('cancelLock').addEventListener('click', ()=> overlay.classList.remove('show'));
document.getElementById('closeAdmin').addEventListener('click', ()=> overlay.classList.remove('show'));
overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.classList.remove('show'); });

document.getElementById('unlockBtn').addEventListener('click', ()=>{
  const val = document.getElementById('pwInput').value;
  if(val === ADMIN_PASSWORD){
    unlocked = true;
    lockStep.style.display='none';
    formStep.style.display='block';
  } else {
    document.getElementById('lockMsg').textContent = 'Incorrect password.';
  }
});
document.getElementById('pwInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('unlockBtn').click();
});

document.getElementById('geocodeBtn').addEventListener('click', async ()=>{
  const q = document.getElementById('placeName').value.trim();
  const resultBox = document.getElementById('geoResult');
  if(!q){ resultBox.innerHTML = ''; return; }
  resultBox.innerHTML = `<div class="geo-result">Searching…</div>`;
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if(data && data.length){
      const r = data[0];
      document.getElementById('latInput').value = parseFloat(r.lat).toFixed(4);
      document.getElementById('lngInput').value = parseFloat(r.lon).toFixed(4);
      resultBox.innerHTML = `<div class="geo-result">Found: ${r.display_name}</div>`;
    } else {
      resultBox.innerHTML = `<div class="geo-result">No match found — enter lat/lng manually below.</div>`;
    }
  }catch(e){
    resultBox.innerHTML = `<div class="geo-result">Search failed — enter lat/lng manually below.</div>`;
  }
});

document.getElementById('savePinBtn').addEventListener('click', ()=>{
  const name = document.getElementById('placeName').value.trim();
  const lat = parseFloat(document.getElementById('latInput').value);
  const lng = parseFloat(document.getElementById('lngInput').value);
  const type = document.getElementById('typeInput').value;
  const dates = document.getElementById('dateInput').value.trim();
  const notes = document.getElementById('notesInput').value.trim();
  const msg = document.getElementById('saveMsg');

  if(!name || isNaN(lat) || isNaN(lng)){
    msg.className = 'msg err';
    msg.textContent = 'Add a name and valid coordinates first.';
    return;
  }

  const pins = getCustomPins();
  pins.push({name, lat, lng, type, dates, notes});
  saveCustomPins(pins);

  msg.className = 'msg ok';
  msg.textContent = `Saved "${name}".`;
  document.getElementById('placeName').value='';
  document.getElementById('latInput').value='';
  document.getElementById('lngInput').value='';
  document.getElementById('dateInput').value='';
  document.getElementById('notesInput').value='';
  document.getElementById('geoResult').innerHTML='';

  renderAll();
});

function renderAdminList(pins){
  const list = document.getElementById('adminList');
  if(!pins.length){
    list.innerHTML = `<div style="color:#a39c8a;">No pins added on this device yet.</div>`;
    return;
  }
  list.innerHTML = pins.map((p,i)=>`
    <div class="pin-row">
      <span>${p.type === 'lived' ? '🏠' : '📍'} ${p.name}</span>
      <button data-idx="${i}" class="del-pin">Remove</button>
    </div>`).join('');
  list.querySelectorAll('.del-pin').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx,10);
      const pins = getCustomPins();
      pins.splice(idx,1);
      saveCustomPins(pins);
      renderAll();
    });
  });
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const custom = getCustomPins();
  const allVisited = VISITED.concat(custom.filter(p=>p.type!=='lived'));
  const allLived = LIVED.concat(custom.filter(p=>p.type==='lived'));

  const fmt = arr => arr.map(p=>{
    const parts = [`name:${JSON.stringify(p.name)}`, `lat:${p.lat}`, `lng:${p.lng}`];
    if(p.dates) parts.push(`dates:${JSON.stringify(p.dates)}`);
    if(p.notes) parts.push(`notes:${JSON.stringify(p.notes)}`);
    return `  {${parts.join(', ')}}`;
  }).join(',\n');

  const newVisitedStr = `const VISITED = [\n${fmt(allVisited)}\n];`;
  const newLivedStr = `const LIVED = [\n${fmt(allLived)}\n];`;

  // Capture full current page source
  let htmlContent = document.documentElement.outerHTML;

  // Replace old array definitions with newly updated datasets
  htmlContent = htmlContent.replace(/const VISITED = \[[\s\S]*?\];/, newVisitedStr);
  htmlContent = htmlContent.replace(/const LIVED = \[[\s\S]*?\];/, newLivedStr);

  // Trigger full HTML file download
  const blob = new Blob(['<!DOCTYPE html>\n' + htmlContent], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'travel-map.html';
  a.click();
  URL.revokeObjectURL(url);

  // Reset local storage cache to eliminate duplicate rendering
  localStorage.removeItem('travelMapCustomPins');
  renderAll();
});

renderAll();
</script>
