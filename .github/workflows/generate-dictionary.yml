name: Generate Wordle Dictionaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dictionaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and process answer & guess lists
        run: |
          # Fetch standard curated answer list (~2,300 common solution words)
          curl -s "https://raw.githubusercontent.com/3b1b/videos/master/_2022/wordle/data/possible_words.txt" \
            | tr '[:lower:]' '[:upper:]' \
            | jq -R . | jq -s . > answers.json

          # Fetch full valid dictionary (~12,000+ total allowable guesses)
          curl -s "https://raw.githubusercontent.com/3b1b/videos/master/_2022/wordle/data/allowed_words.txt" \
            | tr '[:lower:]' '[:upper:]' \
            | jq -R . | jq -s . > guesses.json

      - name: Commit and push dictionary files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add answers.json guesses.json
          git commit -m "Generate answers.json and guesses.json" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
